<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>Conversation | Role-Specific Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <script src="{{ url_for('static', filename='js/chat.js') }}" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="chat-card" aria-labelledby="chat-title">
        <header class="chat-header">
          <div class="assistant-mark" aria-hidden="true">A</div>
          <div class="header-copy">
            <p class="eyebrow">Role-specific assistant</p>
            <h1 id="chat-title">Text conversation</h1>
          </div>
          <span class="connection-label">Text chat</span>
        </header>

        <div class="conversation" id="conversation" role="log" aria-live="polite" aria-relevant="additions text">
          <p class="welcome-note">Send a message to start a conversation.</p>
        </div>
        <p class="tts-status" id="tts-status" role="status" aria-live="polite"></p>

        <form class="composer" id="chat-form">
          <label class="sr-only" for="message-input">Your message</label>
          <textarea
            id="message-input"
            name="message"
            rows="1"
            placeholder="Write a message..."
            autocomplete="off"
            required
          ></textarea>
          <button
            class="mic-button"
            id="mic-button"
            type="button"
            aria-label="Start speech recognition"
            aria-pressed="false"
            title="Start speech recognition"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
              <rect x="9" y="3" width="6" height="12" rx="3" stroke="currentColor" stroke-width="1.8" />
              <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3m-4 0h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>
          <button class="send-button" id="send-button" type="submit">
            <span>Send</span>
            <svg aria-hidden="true" viewBox="0 0 20 20" fill="none">
              <path d="M3 10h13M10 4l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </form>
        <p class="speech-status" id="speech-status" role="status" aria-live="polite"></p>
        <p class="composer-hint">Press Enter to send · Shift + Enter for a new line</p>
      </section>
    </main>
  </body>
</html>
